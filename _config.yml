# 60 Words About the Author
author-about:  Hi, I'm Christian Gumbsch. I research how robots can use world models and foundation models to imagine the future, judge the outcomes of their actions, and act on that.<span style="display:block;height:0.75em;"></span>I'm currently a postdoc at the <a href="https://ivi.fnwi.uva.nl/vislab/">University of Amsterdam</a>, working with Stratis Gavves. Previously, I did my PhD at the <a href="https://al.is.mpg.de/">Max Planck Institute for Intelligent Systems</a> and the <a href="https://uni-tuebingen.de/fakultaeten/mathematisch-naturwissenschaftliche-fakultaet/fachbereiche/informatik/lehrstuehle/cognitive-modeling/">University of Tübingen</a>, jointly supervised by Georg Martius and Martin Butz, followed by a postdoc at <a href="https://tu-dresden.de/mn/psychologie/ifap/kknw">TU Dresden</a> working with Katharina von Kriegstein.
# URL to the Author's Profile (i.e., Github, Twitter, Stackoverflow, etc)
author-url: https://github.com/cgumbsch

# SASS
sass:
  sass_dir: _sass
  style: compressed

# Build settings
plugins:
  - jekyll-admin
  - jekyll-feed
  - jemoji

# Permalink
permalink: "blog/:title"

# Compress
compress_html:
  clippings: all

# Defaults
defaults:
  -
    scope:
      type: 'posts'
    values:
      layout: post
      post-image: ""
      description: ""
      tags:
        - ""
  -
    scope:
      type: 'pages'
    values:
      layout: page

# Exclude
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
