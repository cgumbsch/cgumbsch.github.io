<script>
  /* Highlight the navbar link of the section in view (matched by id; papers.html adds a second navbar) */
  var navLinks = Array.prototype.slice.call(document.querySelectorAll('.navbar-end a.navbar-item'));
  const viewOffset = 200;

  function highlightNav() {
    var scroll = window.scrollY;
    navLinks.forEach(function (link) {
      var section = document.getElementById(link.hash.slice(1));
      var active = section && scroll >= section.offsetTop - viewOffset && scroll < section.offsetTop + section.offsetHeight - viewOffset;
      link.classList.toggle('is-active', !!active);
    });
  }
  window.addEventListener("scroll", highlightNav);
  highlightNav();
</script>
